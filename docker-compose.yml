version: "3.9"

services:
  # ───────────────────────────────────────────────
  # Backend – FastAPI ingestion & Cognee graph memory
  # ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spillthereel-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ───────────────────────────────────────────────
  # Frontend – (Pending: Flutter or React Native)
  # Uncomment and configure once the framework is chosen.
  # ───────────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: spillthereel-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
